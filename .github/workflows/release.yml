name: Release

# Pushing a tag like v1.2.0 builds the .deb and the AppImage and publishes them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: ./gradlew test -Pfakturka.version=${{ steps.version.outputs.version }}

      - name: Build .deb and distributable
        run: ./gradlew packageDeb createDistributable -Pfakturka.version=${{ steps.version.outputs.version }} -Pfakturka.packagingJdk="$JAVA_HOME"

      - name: Build AppImage
        run: packaging/build-appimage.sh ${{ steps.version.outputs.version }}

      - name: Checksums
        run: |
          mkdir dist
          cp build/compose/binaries/main/deb/*.deb build/appimage/*.AppImage dist/
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Fakturka ${{ steps.version.outputs.version }}" --generate-notes
